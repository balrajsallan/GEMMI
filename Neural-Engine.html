<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Neural Network Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #030305;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
            background-color: #000000;
        }
    </style>
</head>
<body>

    <canvas id="neuralCanvas"></canvas>

    <script>
        const canvas = document.getElementById('neuralCanvas');
        const ctx = canvas.getContext('2d');

        // Resize canvas dynamically
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Neon color palette
        const neonColors = [
            '#ff0055', // Neon Pink
            '#00f3ff', // Neon Cyan
            '#39ff14', // Neon Green
            '#ffe600', // Neon Yellow
            '#bf00ff', // Neon Purple
            '#ff5e00'  // Neon Orange
        ];

        // Layer configuration matching the image
        const layerCounts = [8, 10, 10, 10, 4];
        const layerNames = ["input layer", "hidden layer 1", "hidden layer 2", "hidden layer 3", "output layer"];

        let nodes = [];
        let connections = [];
        let pulses = [];

        class Node {
            constructor(x, y, layerIndex) {
                this.x = x;
                this.y = y;
                this.layerIndex = layerIndex;
                this.radius = 12;
                this.color = '#ffffff';
                this.pulsePhase = Math.random() * Math.PI * 2;
            }

            draw() {
                this.pulsePhase += 0.05;
                const glowSize = 8 + Math.sin(this.pulsePhase) * 4;

                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#0a0a12';
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2.5;
                ctx.shadowColor = '#00f3ff';
                ctx.shadowBlur = glowSize;
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }
        }

        class Connection {
            constructor(startNode, endNode) {
                this.startNode = startNode;
                this.endNode = endNode;
                this.color = neonColors[Math.floor(Math.random() * neonColors.length)];
                this.alpha = 0.25 + Math.random() * 0.35;
                this.lineWidth = 0.8 + Math.random() * 1.2;
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(this.startNode.x, this.startNode.y);
                ctx.lineTo(this.endNode.x, this.endNode.y);
                ctx.strokeStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.lineWidth = this.lineWidth;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 6;
                ctx.stroke();
                ctx.restore();
            }
        }

        class Pulse {
            constructor(connection) {
                this.connection = connection;
                this.progress = 0;
                this.speed = 0.008 + Math.random() * 0.015;
                this.size = 2 + Math.random() * 3;
                this.color = connection.color;
            }

            update() {
                this.progress += this.speed;
                return this.progress <= 1;
            }

            draw() {
                const sx = this.connection.startNode.x;
                const sy = this.connection.startNode.y;
                const ex = this.connection.endNode.x;
                const ey = this.connection.endNode.y;

                const x = sx + (ex - sx) * this.progress;
                const y = sy + (ey - sy) * this.progress;

                ctx.save();
                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 12;
                ctx.fill();
                ctx.restore();
            }
        }

        function initNetwork() {
            nodes = [];
            connections = [];
            pulses = [];

            const width = canvas.width;
            const height = canvas.height;

            const marginX = width * 0.12;
            const layerSpacing = (width - marginX * 2) / (layerCounts.length - 1);
            const startY = height * 0.2;
            const endY = height * 0.85;

            // Generate Nodes
            for (let l = 0; l < layerCounts.length; l++) {
                const count = layerCounts[l];
                const x = marginX + l * layerSpacing;
                const nodeSpacing = (endY - startY) / (count - 1 || 1);

                const layerNodes = [];
                for (let i = 0; i < count; i++) {
                    const y = (count === 1) ? (startY + endY) / 2 : startY + i * nodeSpacing;
                    const node = new Node(x, y, l);
                    layerNodes.push(node);
                }
                nodes.push(layerNodes);
            }

            // Generate Full Connections between adjacent layers
            for (let l = 0; l < nodes.length - 1; l++) {
                const currentLayer = nodes[l];
                const nextLayer = nodes[l + 1];

                for (let n1 of currentLayer) {
                    for (let n2 of nextLayer) {
                        connections.push(new Connection(n1, n2));
                    }
                }
            }
        }

        function drawLabels() {
            const width = canvas.width;
            const marginX = width * 0.12;
            const layerSpacing = (width - marginX * 2) / (layerCounts.length - 1);

            ctx.save();
            ctx.font = '16px "Courier New", Courier, monospace';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.shadowColor = '#00f3ff';
            ctx.shadowBlur = 8;

            for (let l = 0; l < layerNames.length; l++) {
                const x = marginX + l * layerSpacing;
                ctx.fillText(layerNames[l], x, canvas.height * 0.12);
            }

            // Draw right output arrows like in reference diagram
            const outputNodes = nodes[nodes.length - 1];
            if (outputNodes) {
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                for (let node of outputNodes) {
                    ctx.beginPath();
                    ctx.moveTo(node.x + node.radius, node.y);
                    ctx.lineTo(node.x + node.radius + 45, node.y);
                    ctx.lineTo(node.x + node.radius + 35, node.y - 6);
                    ctx.moveTo(node.x + node.radius + 45, node.y);
                    ctx.lineTo(node.x + node.radius + 35, node.y + 6);
                    ctx.stroke();
                }
            }

            ctx.restore();
        }

        function animate() {
            // Dark trail effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Connections
            for (let conn of connections) {
                conn.draw();
            }

            // Spawn random signal pulses
            if (Math.random() < 0.6 && connections.length > 0) {
                const randomConn = connections[Math.floor(Math.random() * connections.length)];
                pulses.push(new Pulse(randomConn));
            }

            // Update & Draw Pulses
            pulses = pulses.filter(pulse => {
                pulse.draw();
                return pulse.update();
            });

            // Draw Nodes
            for (let layer of nodes) {
                for (let node of layer) {
                    node.draw();
                }
            }

            // Draw Text Overlay
            drawLabels();

            requestAnimationFrame(animate);
        }

        // Initialize and start animation loop
        initNetwork();
        animate();

        // Re-initialize layout on window resize
        window.addEventListener('resize', () => {
            initNetwork();
        });
    </script>
</body>
</html>
