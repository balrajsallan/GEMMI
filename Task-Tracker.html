<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Task Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      border: 2px solid #000000;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 4px 4px 0px #000000;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .subtitle {
      text-align: center;
      font-size: 0.9rem;
      margin-bottom: 24px;
      color: #333333;
    }

    .task-list {
      list-style: none;
      margin-bottom: 24px;
    }

    .task-item {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      margin-bottom: 10px;
      border: 1px solid #000000;
      border-radius: 8px;
      transition: background-color 0.2s ease;
      cursor: pointer;
    }

    .task-item:hover {
      background-color: #f5f5f5;
    }

    .task-item input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid #000000;
      border-radius: 4px;
      margin-right: 12px;
      cursor: pointer;
      position: relative;
      outline: none;
    }

    .task-item input[type="checkbox"]:checked {
      background-color: #000000;
    }

    .task-item input[type="checkbox"]:checked::after {
      content: '✓';
      position: absolute;
      color: #ffffff;
      font-size: 14px;
      font-weight: bold;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .task-item.completed span {
      text-decoration: line-through;
      color: #777777;
    }

    .task-item span {
      font-size: 1rem;
      font-weight: 500;
    }

    .complete-btn {
      width: 100%;
      padding: 14px;
      background-color: #000000;
      color: #ffffff;
      border: 2px solid #000000;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }

    .complete-btn:hover {
      background-color: #ffffff;
      color: #000000;
    }

    .complete-btn:disabled {
      background-color: #cccccc;
      border-color: #cccccc;
      color: #666666;
      cursor: not-allowed;
    }

    /* Modal / Celebration Banner Overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 10;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      text-align: center;
      padding: 32px;
      border: 2px solid #000000;
      border-radius: 12px;
      background-color: #ffffff;
      box-shadow: 6px 6px 0px #000000;
      max-width: 360px;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal h2 {
      font-size: 1.8rem;
      margin-bottom: 12px;
    }

    .modal p {
      font-size: 1rem;
      margin-bottom: 20px;
    }

    .close-btn {
      padding: 10px 20px;
      background-color: #000000;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Daily Tasks</h1>
    <p class="subtitle" id="progress-text">0 / 11 tasks completed</p>

    <ul class="task-list" id="taskList">
      <!-- Tasks rendered via JavaScript -->
    </ul>

    <button class="complete-btn" id="completeBtn" onclick="finishDay()">Complete Day</button>
  </div>

  <!-- Congratulations Modal -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <h2>🎉 Congratulations!</h2>
      <p>Your all tasks were completed! Great job today.</p>
      <button class="close-btn" onclick="closeModal()">Close</button>
    </div>
  </div>

  <!-- Canvas for Confetti Animation -->
  <canvas id="confettiCanvas"></canvas>

  <script>
    const tasks = [
      "Daily Routine",
      "Workout",
      "Bath",
      "BreakFast",
      "Learn",
      "Lunch",
      "Lunch (Afternoon)",
      "Work",
      "Nap",
      "Dinner",
      "Sleep"
    ];

    const taskList = document.getElementById('taskList');
    const progressText = document.getElementById('progress-text');
    const completeBtn = document.getElementById('completeBtn');
    const overlay = document.getElementById('overlay');
    const canvas = document.getElementById('confettiCanvas');
    const ctx = canvas.getContext('2d');

    // Render tasks
    function init() {
      taskList.innerHTML = '';
      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.className = 'task-item';
        li.innerHTML = `
          <input type="checkbox" id="task-${index}" onchange="toggleTask(${index})">
          <span>${task}</span>
        `;
        li.addEventListener('click', (e) => {
          if (e.target.tagName !== 'INPUT') {
            const checkbox = li.querySelector('input');
            checkbox.checked = !checkbox.checked;
            toggleTask(index);
          }
        });
        taskList.appendChild(li);
      });
      updateProgress();
    }

    function toggleTask(index) {
      const items = taskList.querySelectorAll('.task-item');
      const checkbox = items[index].querySelector('input');
      if (checkbox.checked) {
        items[index].classList.add('completed');
      } else {
        items[index].classList.remove('completed');
      }
      updateProgress();
    }

    function updateProgress() {
      const checkedCount = taskList.querySelectorAll('input:checked').length;
      progressText.textContent = `${checkedCount} / ${tasks.length} tasks completed`;
    }

    function finishDay() {
      const checkedCount = taskList.querySelectorAll('input:checked').length;
      if (checkedCount === tasks.length) {
        overlay.classList.add('active');
        startConfetti();
      } else {
        alert(`Please complete all tasks first! (${checkedCount}/${tasks.length} done)`);
      }
    }

    function closeModal() {
      overlay.classList.remove('active');
      stopConfetti();
    }

    // Canvas Confetti Animation
    let confettiParticles = [];
    let animationFrameId = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height - canvas.height;
        this.size = Math.random() * 8 + 4;
        this.speedY = Math.random() * 3 + 2;
        this.speedX = Math.random() * 2 - 1;
        this.color = `#000000`; // Black confetti for high-contrast theme
        this.rotation = Math.random() * 360;
        this.rotationSpeed = Math.random() * 10 - 5;
      }

      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        this.rotation += this.rotationSpeed;
        if (this.y > canvas.height) {
          this.y = -10;
          this.x = Math.random() * canvas.width;
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.fillStyle = this.color;
        ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
        ctx.restore();
      }
    }

    function startConfetti() {
      resizeCanvas();
      confettiParticles = Array.from({ length: 80 }, () => new Particle());
      animateConfetti();
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      confettiParticles.forEach((p) => {
        p.update();
        p.draw();
      });
      animationFrameId = requestAnimationFrame(animateConfetti);
    }

    function stopConfetti() {
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // Initialize application
    init();
  </script>
</body>
</html>
