<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathematical Cosmos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020208;
            font-family: 'Courier New', monospace;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            bottom: 24px;
            left: 24px;
            color: rgba(255, 255, 255, 0.45);
            font-size: 11px;
            pointer-events: none;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <canvas id="universe"></canvas>
    <div id="ui">Cosmic Simulation // r = a · e^(bθ)</div>

    <script>
        const canvas = document.getElementById('universe');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        let stars = [];
        let time = 0;

        const MOUSE = { x: 0, y: 0, active: false };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            MOUSE.x = e.clientX;
            MOUSE.y = e.clientY;
            MOUSE.active = true;
        });

        window.addEventListener('mouseleave', () => {
            MOUSE.active = false;
        });

        // Parameters
        const ARMS = 4;
        const SPIRAL_B = 0.22; // Expansion constant for logarithmic spiral
        const TOTAL_STARS = 4000;

        class Star {
            constructor(i) {
                this.reset(i);
            }

            reset(i) {
                // 25% deep background stars, 75% spiral galaxy stars
                this.isBackground = Math.random() < 0.25;

                if (this.isBackground) {
                    this.x = (Math.random() - 0.5) * width * 2;
                    this.y = (Math.random() - 0.5) * height * 2;
                    this.size = Math.random() * 0.8 + 0.2;
                    this.color = `hsl(${200 + Math.random() * 60}, 80%, ${70 + Math.random() * 30}%)`;
                    this.freq = Math.random() * 0.04 + 0.01;
                    this.phase = Math.random() * Math.PI * 2;
                } else {
                    const armIndex = i % ARMS;
                    const armAngleOffset = (armIndex * 2 * Math.PI) / ARMS;
                    
                    // Logarithmic spiral math: r = a * e^(b * theta)
                    const theta = Math.pow(Math.random(), 1.6) * Math.PI * 4;
                    const r = 10 * Math.exp(SPIRAL_B * theta);

                    // Gaussian-like dispersion off the arm core
                    const dispersion = (Math.random() - 0.5) * (theta * 16 + 12);
                    const angle = theta + armAngleOffset;

                    const baseX = r * Math.cos(angle) + dispersion * Math.sin(angle);
                    const baseY = r * Math.sin(angle) + dispersion * Math.cos(angle);
                    this.distFromCenter = Math.hypot(baseX, baseY);

                    // Keplerian orbital velocity decay: v ~ 1 / sqrt(r)
                    this.angularSpeed = 0.0018 / Math.sqrt(Math.max(8, this.distFromCenter * 0.008));
                    this.angle = Math.atan2(baseY, baseX);

                    this.size = Math.max(0.3, (1 - this.distFromCenter / 700) * 1.7 + Math.random() * 0.5);
                    
                    // Stellar spectral classification by temperature:
                    // Dense core (hot blue/white) -> Outer spiral (warm amber/red)
                    const hue = 220 - (this.distFromCenter * 0.16) + (Math.random() * 30 - 15);
                    const lightness = Math.min(90, 50 + (8000 / (this.distFromCenter + 100)));
                    this.color = `hsl(${hue}, 85%, ${lightness}%)`;

                    this.freq = Math.random() * 0.03 + 0.005;
                    this.phase = Math.random() * Math.PI * 2;
                }
            }

            update() {
                if (!this.isBackground) {
                    this.angle += this.angularSpeed;
                    this.x = this.distFromCenter * Math.cos(this.angle);
                    this.y = this.distFromCenter * Math.sin(this.angle);

                    // Subtle gravitational distortion near user pointer
                    if (MOUSE.active) {
                        const mX = MOUSE.x - centerX;
                        const mY = MOUSE.y - centerY;
                        const dx = mX - this.x;
                        const dy = mY - this.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist < 180) {
                            const force = (1 - dist / 180) * 1.8;
                            this.x += (dx / dist) * force;
                            this.y += (dy / dist) * force;
                        }
                    }
                }
            }

            draw() {
                // Trigonometric shimmer calculation
                const twinkle = 0.45 + 0.55 * Math.sin(time * this.freq * 60 + this.phase);

                ctx.save();
                ctx.globalAlpha = Math.max(0.1, twinkle);

                const screenX = centerX + this.x;
                const screenY = centerY + this.y;

                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(screenX, screenY, this.size, 0, Math.PI * 2);
                ctx.fill();

                // Diffuse radial glow for bright stellar objects
                if (this.size > 1.3 && !this.isBackground) {
                    const glow = ctx.createRadialGradient(screenX, screenY, 0, screenX, screenY, this.size * 3.5);
                    glow.addColorStop(0, this.color);
                    glow.addColorStop(1, 'transparent');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, this.size * 3.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        // Initialize stellar array
        for (let i = 0; i < TOTAL_STARS; i++) {
            stars.push(new Star(i));
        }

        // Render supermassive galactic core illumination
        function drawGalacticCore() {
            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            
            const coreGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 280);
            coreGradient.addColorStop(0, 'rgba(255, 248, 220, 0.85)');
            coreGradient.addColorStop(0.12, 'rgba(210, 180, 255, 0.35)');
            coreGradient.addColorStop(0.35, 'rgba(50, 90, 180, 0.12)');
            coreGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = coreGradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 280, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function animate() {
            time += 0.016;

            // Translucent dark background clear creates smooth motion trails
            ctx.fillStyle = 'rgba(2, 2, 8, 0.22)';
            ctx.fillRect(0, 0, width, height);

            drawGalacticCore();

            for (let i = 0; i < stars.length; i++) {
                stars[i].update();
                stars[i].draw();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
