<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        /* Modern Reset & Dark Theme Base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container Card */
        .form-container {
            background-color: #121212;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.03);
        }

        .form-header {
            margin-bottom: 28px;
            text-align: center;
        }

        .form-header h2 {
            color: #ffffff;
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .form-header p {
            color: #888888;
            font-size: 0.95rem;
        }

        /* Layout Grid */
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            margin-bottom: 20px;
        }

        /* Form Labels & Inputs */
        label {
            color: #aaaaaa;
            font-size: 0.85rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            background-color: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 6px;
            color: #ffffff;
            padding: 12px 16px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        input::placeholder {
            color: #555555;
        }

        input:focus {
            border-color: #888888;
            background-color: #222222;
        }

        /* White Submit Button */
        .submit-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 6px;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .submit-btn:hover {
            background-color: #e6e6e6;
        }

        .submit-btn:active {
            transform: scale(0.99);
        }

        /* Feedback Message */
        .status-message {
            margin-top: 16px;
            text-align: center;
            font-size: 0.9rem;
            display: none;
        }

        .status-message.success {
            color: #4caf50;
            display: block;
        }

        .status-message.error {
            color: #f44336;
            display: block;
        }

        /* Responsive Layout for Mobile */
        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="form-header">
            <h2>User Details Form</h2>
            <p>Please fill out all the fields below to submit your details.</p>
        </div>

        <!-- Formspree Endpoint Integration -->
        <form id="detailsForm" action="https://formspree.io/f/theemelem@gmail.com" method="POST">
            
            <!-- Row 1: First Name & Last Name -->
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="First Name" placeholder="John" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="Last Name" placeholder="Doe" required>
                </div>
            </div>

            <!-- Email -->
            <div class="form-group full-width">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="Email" placeholder="john.doe@example.com" required>
            </div>

            <!-- Mobile Number -->
            <div class="form-group full-width">
                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile" name="Mobile" placeholder="+1 234 567 8900" required>
            </div>

            <!-- Row 2: Country & State -->
            <div class="form-row">
                <div class="form-group">
                    <label for="country">Country</label>
                    <input type="text" id="country" name="Country" placeholder="United States" required>
                </div>
                <div class="form-group">
                    <label for="state">State</label>
                    <input type="text" id="state" name="State" placeholder="California" required>
                </div>
            </div>

            <!-- Row 3: Village/City & Zip Code -->
            <div class="form-row">
                <div class="form-group">
                    <label for="city">Village or City</label>
                    <input type="text" id="city" name="Village/City" placeholder="Los Angeles" required>
                </div>
                <div class="form-group">
                    <label for="zipCode">Zip Code</label>
                    <input type="text" id="zipCode" name="Zip Code" placeholder="90001" required>
                </div>
            </div>

            <!-- White Submit Button -->
            <button type="submit" class="submit-btn" id="submitBtn">Submit Details</button>
            
            <div id="statusMessage" class="status-message"></div>
        </form>
    </div>

    <!-- JavaScript Handling Form Submission -->
    <script>
        const form = document.getElementById('detailsForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');

        form.addEventListener('submit', async function(event) {
            event.preventDefault(); // Prevent standard page reload

            submitBtn.textContent = 'Sending...';
            submitBtn.disabled = true;

            const formData = new FormData(form);

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    statusMessage.className = 'status-message success';
                    statusMessage.textContent = 'Thank you! Details sent successfully.';
                    form.reset();
                } else {
                    throw new Error('Form submission failed.');
                }
            } catch (error) {
                statusMessage.className = 'status-message error';
                statusMessage.textContent = 'Oops! There was a problem submitting your form.';
            } finally {
                submitBtn.textContent = 'Submit Details';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
