<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .status {
      font-size: 1.5rem;
      margin-bottom: 20px;
      height: 30px;
      font-weight: 600;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 5px;
      background-color: #444444; /* Line color for grid */
      border: 5px solid #444444;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }

    .cell {
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.2s ease;
    }

    .cell:hover {
      background-color: #111111;
    }

    /* Player Colors */
    .cell.x {
      color: #ff3333; /* Red for Cross */
      text-shadow: 0 0 12px rgba(255, 51, 51, 0.8);
    }

    .cell.o {
      color: #00ff66; /* Green for Zero */
      text-shadow: 0 0 12px rgba(0, 255, 102, 0.8);
    }

    .restart-btn {
      margin-top: 25px;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: bold;
      color: #ffffff;
      background-color: #222222;
      border: 2px solid #555555;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .restart-btn:hover {
      background-color: #ffffff;
      color: #000000;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    /* Modal / Overlay for Winning Celebration */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 10;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .celebration-box {
      background: #111;
      border: 3px solid #ff0055;
      border-radius: 15px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 0 30px #ff0055;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .celebration-text {
      font-size: 2.5rem;
      margin-bottom: 20px;
      font-weight: bold;
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Celebration Confetti Particle */
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      top: -10px;
      border-radius: 2px;
      animation: fall 3s linear infinite;
    }

    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(720deg);
      }
    }
  </style>
</head>
<body>

  <h1>Tic-Tac-Toe</h1>
  <div class="status" id="statusText">Cross (X)'s Turn</div>

  <div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>

  <button class="restart-btn" id="restartBtn">Restart Game</button>

  <!-- Winner Celebration Overlay -->
  <div class="overlay" id="overlay">
    <div class="celebration-box" id="celebrationBox">
      <div class="celebration-text" id="winnerText"></div>
      <button class="restart-btn" onclick="restartGame()">Play Again</button>
    </div>
  </div>

  <script>
    const cells = document.querySelectorAll('.cell');
    const statusText = document.getElementById('statusText');
    const restartBtn = document.getElementById('restartBtn');
    const overlay = document.getElementById('overlay');
    const winnerText = document.getElementById('winnerText');
    const celebrationBox = document.getElementById('celebrationBox');

    // Winning combinations (rows, columns, diagonals)
    const winConditions = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // Horizontal
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // Vertical
      [0, 4, 8], [2, 4, 6]             // Diagonal
    ];

    let boardState = ["", "", "", "", "", "", "", "", ""];
    let currentPlayer = "X";
    let isGameActive = true;

    // Initialize Game
    cells.forEach(cell => cell.addEventListener('click', handleCellClick));
    restartBtn.addEventListener('click', restartGame);

    function handleCellClick(e) {
      const cellIndex = e.target.getAttribute('data-index');

      if (boardState[cellIndex] !== "" || !isGameActive) {
        return;
      }

      updateCell(e.target, cellIndex);
      checkWinner();
    }

    function updateCell(cell, index) {
      boardState[index] = currentPlayer;
      cell.textContent = currentPlayer === "X" ? "X" : "O";
      cell.classList.add(currentPlayer.toLowerCase());
    }

    function switchPlayer() {
      currentPlayer = currentPlayer === "X" ? "O" : "X";
      const name = currentPlayer === "X" ? "Cross (X)" : "Zero (O)";
      statusText.textContent = `${name}'s Turn`;
    }

    function checkWinner() {
      let roundWon = false;
      let winningPlayer = "";

      for (let i = 0; i < winConditions.length; i++) {
        const [a, b, c] = winConditions[i];
        if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
          roundWon = true;
          winningPlayer = boardState[a];
          break;
        }
      }

      if (roundWon) {
        isGameActive = false;
        const winnerName = winningPlayer === "X" ? "Cross (X)" : "Zero (O)";
        const winnerColor = winningPlayer === "X" ? "#ff3333" : "#00ff66";
        
        triggerCelebration(`${winnerName} Wins! 🎉`, winnerColor);
        return;
      }

      // Check for Draw
      if (!boardState.includes("")) {
        isGameActive = false;
        triggerCelebration("It's a Draw! 🤝", "#ffffff");
        return;
      }

      switchPlayer();
    }

    function triggerCelebration(message, color) {
      winnerText.textContent = message;
      winnerText.style.color = color;
      celebrationBox.style.borderColor = color;
      celebrationBox.style.boxShadow = `0 0 30px ${color}`;
      
      createConfetti(color);
      overlay.classList.add('active');
    }

    function createConfetti(color) {
      removeConfetti();
      for (let i = 0; i < 50; i++) {
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.animationDelay = Math.random() * 2 + 's';
        confetti.style.backgroundColor = Math.random() > 0.5 ? color : '#ffffff';
        overlay.appendChild(confetti);
      }
    }

    function removeConfetti() {
      const confettis = document.querySelectorAll('.confetti');
      confettis.forEach(c => c.remove());
    }

    function restartGame() {
      boardState = ["", "", "", "", "", "", "", "", ""];
      currentPlayer = "X";
      isGameActive = true;
      statusText.textContent = "Cross (X)'s Turn";

      cells.forEach(cell => {
        cell.textContent = "";
        cell.classList.remove('x', 'o');
      });

      overlay.classList.remove('active');
      removeConfetti();
    }
  </script>
</body>
</html>
